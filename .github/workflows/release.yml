name: Release

on:
  release:
    types: [published]

jobs:
  gem:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          rubygems: latest

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2
        with:
          owner: "247615"

      - uses: rubygems/release-gem@v1.4.1
        with:
          setup-trusted-publisher: false
